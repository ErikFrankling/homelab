name: Renovate

# Image updates for the cluster (.github/renovate.json5, docs/updates.md).
# 04:45 UTC: after the Proxmox reboot window, before the 07:00 CET morning
# check, which sees anything an update broke.
on:
  schedule:
    - cron: "45 4 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Only report what it would do"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: renovatebot/github-action@v46.3.9
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          RENOVATE_GIT_AUTHOR: "Renovate <renovate@users.noreply.github.com>"
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          LOG_LEVEL: info
