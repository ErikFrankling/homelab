apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homelab
  namespace: homelab
spec:
  interval: 1m
  ref:
    branch: main
  timeout: 60s
  url: https://github.com/ErikFrankling/homelab.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab
  namespace: homelab
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  force: false
  interval: 1m
  path: ./kubernetes/homelab
  prune: true
  retryInterval: 30s
  serviceAccountName: homelab-reconciler
  sourceRef:
    kind: GitRepository
    name: homelab
  targetNamespace: homelab
  timeout: 10m
  wait: true
---
# Cluster-scoped policies: the Kyverno rule that zeroes CPU requests and the
# homelab-core PriorityClass. Separate from `homelab` because that one is
# bound to the homelab namespace.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-policies
  namespace: homelab
spec:
  force: false
  interval: 1m
  path: ./kubernetes/bootstrap/policies
  prune: true
  retryInterval: 30s
  serviceAccountName: homelab-policy-reconciler
  sourceRef:
    kind: GitRepository
    name: homelab
  timeout: 5m
  wait: true
