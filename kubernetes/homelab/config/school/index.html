<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="preload" href="/inter.woff2" as="font" type="font/woff2" crossorigin>
<title>School</title>
<style>
@font-face { font-family: "Inter"; src: url("/inter.woff2") format("woff2"); font-weight: 100 900; font-display: block; }

/* Reference: Linear / Things 3. Neutral surfaces, hairlines instead of cards,
   one accent, course colour only as a small marker, red only for overdue.
   Type scale 12 / 13 / 15 / 17 / 24. Spacing on a 4 px grid. */
:root {
  --bg: #0e0f11;
  --bg-2: #141518;      /* drawer, popover */
  --bg-3: #1c1d21;      /* hover, pressed */
  --line: #212226;
  --line-2: #2d2e33;
  --text: #ededef;
  --text-2: #a3a4ab;
  --text-3: #74757d;
  --accent: #7b83eb;
  --accent-bg: #7b83eb24;
  --red: #ef5f67;
  --header: 105px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scrollbar-gutter: stable; background: var(--bg); scrollbar-color: #2e3036 transparent; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
  font-size: 15px; line-height: 20px; letter-spacing: -0.006em;
  font-feature-settings: "cv11", "ss03";
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
}
.num, time, .t { font-variant-numeric: tabular-nums; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; letter-spacing: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
body.v-agenda .wrap { max-width: 808px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; display: inline-block; }

/* ---------- header ---------- */
header.app { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
.bar1 { height: 56px; display: flex; align-items: center; gap: 24px; }
.wordmark { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.tabs { display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: #16171a; }
.tabs button { height: 32px; padding: 0 14px; white-space: nowrap; border-radius: 6px; color: #8d8e96; font-size: 13px; font-weight: 500; }
.tabs button:hover { color: var(--text); }
.tabs button.on { color: var(--text); background: #26272c; }
.synced { margin-left: auto; color: var(--text-3); font-size: 12px; }
.bar2 { height: 48px; display: flex; align-items: center; }
.filters { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; margin-left: -10px; }
.filters::-webkit-scrollbar { display: none; }
.filter { height: 32px; padding: 0 10px; display: inline-flex; align-items: center; gap: 8px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--text-2); white-space: nowrap; }
.filter:hover { background: var(--bg-3); color: var(--text); }
.filter.off { opacity: .4; }

main { padding-bottom: calc(64px + env(safe-area-inset-bottom)); min-height: calc(100vh - var(--header)); }

/* ---------- agenda ---------- */
.summary { display: flex; align-items: center; gap: 8px; padding: 24px 0 0; font-size: 13px; color: var(--text-2); }
.summary .od { color: var(--red); font-weight: 500; }
.summary .sep { color: var(--text-3); }
.summary .showdone { margin-left: auto; height: 32px; padding: 0 10px; margin-right: -10px; border-radius: 6px; color: var(--text-2); font-size: 13px; display: inline-flex; align-items: center; gap: 8px; }
.summary .showdone .mini { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid #4b4c53; display: grid; place-items: center; }
.summary .showdone.on .mini { background: var(--accent); border-color: var(--accent); }
.summary .showdone .mini svg { width: 9px; height: 9px; display: none; }
.summary .showdone.on .mini svg { display: block; }
.summary .showdone:hover { background: var(--bg-3); color: var(--text); }
.group { margin-top: 24px; }
.dayhead {
  position: sticky; top: var(--header); z-index: 2; background: var(--bg);
  display: flex; align-items: baseline; gap: 8px; margin: 0; padding: 12px 0 8px;
  font-size: 17px; line-height: 24px; font-weight: 600; letter-spacing: -0.014em; color: var(--text);
}
.dayhead .sub { font-size: 13px; letter-spacing: -0.006em; color: var(--text-3); font-weight: 500; }
.dayhead .count { margin-left: auto; font-size: 13px; letter-spacing: 0; color: var(--text-3); font-weight: 500; }
.row { display: grid; grid-template-columns: 44px 1fr auto; align-items: start; cursor: pointer; position: relative; border-radius: 8px; }
.row::after { content: ""; position: absolute; left: 44px; right: 0; bottom: 0; height: 1px; background: var(--line); }
.row:last-child::after { display: none; }
.row:hover { background: #121316; }
.row .main { min-width: 0; padding: 12px 12px 12px 0; }
.row .title { font-size: 15px; line-height: 20px; font-weight: 500; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row .meta { margin-top: 4px; font-size: 13px; line-height: 16px; color: var(--text-2); display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
.row .meta .sep { color: var(--text-3); }
.row .newdot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin: 0 8px 2px 0; vertical-align: middle; }
.row .side { text-align: right; padding: 12px 4px 12px 8px; }
.row .side time { display: block; font-size: 15px; line-height: 20px; font-weight: 500; color: var(--text-2); }
.row .side .st { display: block; margin-top: 4px; font-size: 12px; line-height: 16px; color: var(--text-3); white-space: nowrap; }
.row.soon .side time { color: var(--text); }
.row.late .side time { color: var(--red); }
.row.done .title, .row.passed .title { color: var(--text-3); }
.row.done .meta, .row.passed .meta, .row.done .side time, .row.passed .side time { color: var(--text-3); }
.row.deferred .title { color: var(--text-2); }

/* checkbox: 20 px square in a 44 px tap target, centred on the first line */
.cb { width: 44px; height: 44px; display: grid; place-items: center start; }
.cb span { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #4b4c53; display: grid; place-items: center; transition: background .15s, border-color .15s, transform .15s; }
.cb:hover span { border-color: #8a8b93; }
.cb:active span { transform: scale(.9); }
.cb svg { width: 12px; height: 12px; opacity: 0; transform: scale(.6); transition: opacity .15s, transform .15s; }
.cb.on span { background: var(--accent); border-color: var(--accent); }
.cb.on svg { opacity: 1; transform: none; }
.row.deferred .cb span { border-style: dashed; }

.quiet { display: flex; align-items: center; gap: 8px; width: 100%; height: 48px; color: var(--text-2); font-size: 13px; border-top: 1px solid var(--line); }
.quiet:hover { color: var(--text); }
.empty { padding: 4px 0 0 44px; color: var(--text-3); font-size: 13px; line-height: 20px; }
.foot { margin-top: 48px; color: var(--text-3); font-size: 12px; line-height: 20px; }
.foot a { color: var(--text-2); text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }

/* ---------- calendar head ---------- */
.calhead { display: flex; align-items: center; gap: 12px; padding: 24px 0 16px; }
.calhead h2 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.022em; }
.calhead h2 .sub { color: var(--text-3); font-weight: 500; }
.calhead .tag { font-size: 13px; color: var(--text-3); font-weight: 500; }
.calnav { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.calnav button { height: 32px; min-width: 32px; padding: 0 12px; border-radius: 6px; color: var(--text-2); font-size: 13px; font-weight: 500; display: grid; place-items: center; }
.calnav button:hover { background: var(--bg-3); color: var(--text); }
.calnav .arrow { padding: 0; }
.calnav .today-btn { border: 1px solid var(--line-2); }

/* ---------- month ---------- */
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: 32px; grid-auto-rows: var(--rowh, 132px); border-top: 1px solid var(--line); }
.month > .dow { height: 32px; }
.dow { display: flex; align-items: center; padding: 0 8px; font-size: 12px; font-weight: 500; color: var(--text-3); border-bottom: 1px solid var(--line); }
.cell { padding: 8px 4px 4px; border-bottom: 1px solid #1a1b1e; border-right: 1px solid #1a1b1e; display: flex; flex-direction: column; gap: 2px; min-width: 0; min-height: 0; overflow: hidden; }
.cell.c7 { border-right: 0; }
.cell .n { align-self: flex-start; height: 22px; min-width: 22px; padding: 0 5px; margin: 0 0 2px 0; display: grid; place-items: center; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--text-2); }
.cell.out .n { color: #5c5d64; }
.cell.today .n { color: var(--accent); background: var(--accent-bg); font-weight: 600; }
.chip { display: grid; grid-template-columns: 7px 34px 1fr; gap: 0 6px; align-items: baseline; padding: 2px 6px; border-radius: 4px; font-size: 12px; line-height: 16px; cursor: pointer; text-align: left; width: 100%; }
.chip:hover { background: var(--bg-3); }
.chip .dot { transform: translateY(-1px); }
.chip .t { color: var(--text-3); }
.chip .x { color: var(--text); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
.chip.done .x, .chip.passed .x, .chip.deferred .x { color: var(--text-3); }
.chip.allday .x { grid-column: 2 / 4; }
.chip.late .t, .chip.late .x { color: var(--red); }
.more { margin-top: auto; align-self: stretch; text-align: left; font-size: 12px; line-height: 16px; color: var(--text-2); padding: 2px 6px 2px 53px; border-radius: 4px; font-weight: 500; }
.more:hover { background: var(--bg-3); color: var(--text); }
.mdots { display: none; }
.pop { position: absolute; z-index: 6; width: 340px; max-height: min(420px, calc(100vh - 32px)); overflow-y: auto; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: 0 12px 32px #00000099, 0 0 0 1px #00000066; padding: 4px 4px 8px; }
.pop .ph { display: flex; align-items: center; gap: 8px; padding: 8px 4px 8px 10px; font-size: 13px; font-weight: 600; position: sticky; top: -4px; background: var(--bg-2); }
.pop .ph .sub { color: var(--text-3); font-weight: 500; }
.pop .ph button { margin-left: auto; width: 36px; height: 36px; border-radius: 6px; display: grid; place-items: center; color: var(--text-2); }
.pop .ph button:hover { background: var(--bg-3); color: var(--text); }
.pop .chip { padding: 6px 8px; font-size: 13px; line-height: 18px; grid-template-columns: 7px 38px 1fr; }
.pop .chip .x { -webkit-line-clamp: 3; }

/* ---------- week ---------- */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); min-height: calc(100vh - var(--header) - 136px); }
.wcol { border-right: 1px solid var(--line); padding: 12px 4px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.wcol:last-child { border-right: 0; }
.wcol.today { background: #7b83eb0d; }
.wcol h4 { margin: 0 8px 12px; display: flex; align-items: baseline; gap: 6px; font-size: 13px; font-weight: 500; color: var(--text-3); }
.wcol h4 b { font-size: 17px; line-height: 24px; font-weight: 600; color: var(--text); }
.wcol h4 b { padding: 0 5px; margin-left: -5px; border-radius: 6px; }
.wcol.today h4 b { color: var(--accent); background: var(--accent-bg); }
.wcol .chip { padding: 6px 8px; grid-template-columns: 7px 1fr; gap: 2px 8px; }
.wcol .chip .x { font-size: 13px; line-height: 18px; -webkit-line-clamp: 3; }
.wcol .chip .c { grid-column: 2; font-size: 12px; line-height: 16px; color: var(--text-3); }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; z-index: 20; background: #00000080; opacity: 0; pointer-events: none; transition: opacity .16s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; z-index: 21; top: 0; right: 0; bottom: 0; width: min(600px, 100vw); background: var(--bg-2); border-left: 1px solid var(--line-2); box-shadow: -24px 0 48px #00000066; overflow-y: auto; overflow-x: hidden; transform: translateX(104%); transition: transform .2s cubic-bezier(.2,.8,.2,1); overscroll-behavior: contain; scrollbar-color: #2e3036 transparent; }
.drawer.open { transform: none; }
.dtop { position: sticky; top: 0; z-index: 2; height: calc(52px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 12px 0; display: flex; align-items: center; background: var(--bg-2); border-bottom: 1px solid transparent; }
.dtop.scrolled { border-bottom-color: var(--line); }
.dtop .ttl { margin-left: 8px; font-size: 13px; font-weight: 500; color: var(--text-2); opacity: 0; transition: opacity .15s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dtop.scrolled .ttl { opacity: 1; }
.iconbtn { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; color: var(--text-2); flex: none; }
.iconbtn:hover { color: var(--text); background: var(--bg-3); }
.iconbtn svg.i { width: 20px; height: 20px; }
.dbody { padding: 8px 40px 64px; }
.dcourse { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
.dbody h1 { margin: 12px 0 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.022em; text-wrap: balance; }
.ddue { margin-top: 12px; font-size: 15px; line-height: 24px; font-weight: 500; color: var(--text); }
.ddue .rel { color: var(--text-2); font-weight: 500; }
.ddue.late .rel { color: var(--red); }
.dmeta { margin-top: 8px; font-size: 13px; line-height: 20px; color: var(--text-2); }
.dmeta .sep { color: var(--text-3); margin: 0 6px; }
.dactions { margin-top: 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.donebtn { height: 40px; padding: 0 16px; border-radius: 8px; background: var(--bg-3); border: 1px solid var(--line-2); color: var(--text); display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
.donebtn:hover { background: #232428; }
.donebtn svg { width: 12px; height: 12px; display: none; }
.donebtn.on { background: var(--accent-bg); border-color: transparent; color: #b9beff; }
.donebtn.on svg { display: block; }
.dstatus { font-size: 13px; line-height: 20px; color: var(--text-3); }
.dstatus button { color: var(--text-2); text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.note { margin-top: 24px; font-size: 14px; line-height: 22px; color: var(--text); max-width: 64ch; }
.note b.k { display: block; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text-3); margin-bottom: 4px; }
.note.warn { padding: 12px 16px; border-radius: 8px; background: #c9a25a12; }
.note.warn b.k { color: #d4ad63; }
.dsec { margin: 40px 0 8px; font-size: 13px; line-height: 16px; font-weight: 600; color: var(--text-2); }

/* markdown */
.md { font-size: 15px; line-height: 24px; color: #d8d9dd; max-width: 64ch; overflow-wrap: anywhere; }
.md.clamped { max-height: 264px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 calc(100% - 72px), transparent); mask-image: linear-gradient(#000 calc(100% - 72px), transparent); }
.md > :first-child { margin-top: 0; }
.md p { margin: 0 0 12px; }
.md h3, .md h4, .md h5, .md h6 { margin: 20px 0 8px; font-size: 15px; line-height: 20px; font-weight: 600; color: var(--text); }
.md ul, .md ol { margin: 0 0 12px; padding-left: 20px; }
.md li { margin: 4px 0; padding-left: 4px; }
.md li::marker { color: var(--text-3); }
.md strong { color: var(--text); font-weight: 600; }
.md a { color: var(--text); text-decoration: underline; text-decoration-color: #7b83eb88; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.md a:hover { text-decoration-color: var(--accent); }
.md code { font: 13px/1 ui-monospace, "SF Mono", Menlo, monospace; background: var(--bg-3); border-radius: 4px; padding: 2px 4px; }
.md pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px; overflow-x: auto; }
.md pre code { background: none; padding: 0; line-height: 20px; }
.md blockquote { margin: 0 0 12px; padding-left: 16px; border-left: 2px solid var(--line-2); color: var(--text-2); }
.md .hex { font: 13px/24px ui-monospace, "SF Mono", Menlo, monospace; color: var(--text-2); white-space: nowrap; }
.showmore { margin-top: 4px; height: 32px; padding: 0 10px; margin-left: -10px; border-radius: 6px; font-size: 13px; font-weight: 500; color: #b9beff; display: inline-flex; align-items: center; gap: 6px; }
.showmore:hover { background: var(--bg-3); color: var(--text); }

.links { border-top: 1px solid var(--line); }
.link { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.link .lt { flex: 1; min-width: 0; font-size: 14px; line-height: 20px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link .lk { font-size: 12px; color: #84858d; white-space: nowrap; }
.link svg.i { color: var(--text-3); width: 14px; height: 14px; }
.link:hover .lt { text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.link:hover svg.i { color: var(--text-2); }
.ann { display: block; padding: 12px 0; border-bottom: 1px solid var(--line); }
.ann .at { display: block; font-size: 14px; line-height: 20px; font-weight: 500; }
.ann .ad { display: block; margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--text-3); }
.ann .ax { display: -webkit-box; margin-top: 4px; font-size: 13px; line-height: 20px; color: var(--text-2); -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ann:hover .at { text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }

/* ---------- phone ---------- */
@media (max-width: 720px) {
  :root { --header: 101px; }
  .wrap { padding: 0 16px; }
  .bar1 { height: 52px; gap: 12px; }
  .tabs { margin-left: auto; }
  .tabs button { padding: 0 12px; }
  .synced { display: none; }
  .filters { padding-right: 24px; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 32px), transparent); }
  .summary { padding-top: 16px; }
  .month { grid-auto-rows: 52px; border-top: 0; }
  .month > .dow { height: 28px; }
  .dow { justify-content: center; padding: 0; border-bottom: 0; }
  .cell { border: 0; border-top: 1px solid var(--line); padding: 6px 0 0; align-items: center; cursor: pointer; overflow: visible; }
  .cell .n { align-self: center; height: 28px; min-width: 28px; padding: 0; font-size: 15px; border-radius: 8px; }
  .cell.out .n { color: #45464c; }
  .cell.sel .n { box-shadow: inset 0 0 0 1px var(--line-2); color: var(--text); }
  .cell.today.sel .n { box-shadow: none; color: var(--accent); }
  .mdots { display: flex; align-items: center; gap: 3px; height: 8px; margin-top: 4px; }
  .mdots .dot { width: 5px; height: 5px; }
  .mdots .dot.faded { opacity: .35; }
  .mdots .plus { font-size: 10px; line-height: 8px; color: #8d8e96; font-weight: 500; margin-left: 1px; }
  .month { grid-template-rows: 28px; }
  .daylist { margin-top: 8px; border-top: 1px solid var(--line); }
  .week { display: block; border: 0; min-height: 0; }
  .calhead h2 { font-size: 20px; line-height: 28px; }
  .dbody { padding: 4px 20px 48px; }
  .dbody h1 { font-size: 22px; line-height: 28px; }
  .donebtn { width: 100%; justify-content: center; height: 44px; }
  .dactions { gap: 12px; }
}
</style>
</head>
<body>
<header class="app">
  <div class="wrap">
    <div class="bar1">
      <span class="wordmark">School</span>
      <nav class="tabs" id="tabs"><button data-v="agenda">Agenda</button><button data-v="week">Week</button><button data-v="month">Month</button></nav>
      <span class="synced" id="synced"></span>
    </div>
    <div class="bar2"><div class="filters" id="filters"></div></div>
  </div>
</header>
<main class="wrap" id="main"></main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-modal="true" role="dialog"></aside>
<!--DATA-->
<script>
const TZ = "Europe/Stockholm";
// Distinct hues at one lightness; none of them is the overdue red or the accent.
const COLORS = { DA2210: "#d8b45a", DD2300: "#4fb3a2", DD2395: "#e38a55", DD2440: "#b087e0", IK2218: "#5d9fe0", SF1688: "#7fb870", KTH: "#8a8b93" };
const KIND = { assignment: "Assignment", quiz: "Quiz", lab: "Lab", seminar: "Seminar", exam: "Exam", "peer review": "Peer review", registration: "Registration", event: "Event" };

// ---- dates, always in Stockholm ----

// ---- status ----
const PASSIVE = new Set(["exam", "seminar", "event", "registration"]);
function status(it) {

// ---- agenda ----
function row(it, opts = {}) {

function agenda() {

// ---- month ----
function onDay(k) { return DATA.items.filter((it) => listed(it) && dueKey(it) === k).sort(byDue); }

function week() {

// ---- markdown: escape first, then a small, strict subset ----
function inline(s) {

    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")

    if ((m = l.match(/^(#{1,6})\s+(.*)/))) { const n = Math.min(6, Math.max(3, m[1].length)); out.push(`<h${n}>${inline(m[2])}</h${n}>`); i++; continue; }

      ${it.deferred ? `<div class="note warn"><b class="k">Not due this round</b>${inline(it.deferred.note.replace(/^\*\*Not due this round\.\*\*\s*/, ""))}</div>` : ""}
      ${det.notes.map((n) => `<div class="note"><b class="k">Note</b>${inline(n)}</div>`).join("")}
      ${det.body ? `<h2 class="dsec">Description</h2><div class="md${long ? " clamped" : ""}">${md(det.body)}</div>${long ? `<button class="showmore" data-expand>Show full description ${I.down}</button>` : ""}` : ""}
      <h2 class="dsec">Sources</h2>
      <div class="links">${links.map((s) => { const [kk, n0] = sourceKind(s.label, s.url), nn = n0.charAt(0).toUpperCase() + n0.slice(1); return `<a class="link" href="${esc(s.url)}" target="_blank" rel="noopener"><span class="lt">${esc(nn)}</span><span class="lk">${esc(kk)}</span>${I.out}</a>`; }).join("")}</div>
      ${det.related.length ? `<h2 class="dsec">Announcements</h2><div class="links">${det.related.map((a) => `<a class="ann" href="${esc(a.url)}" target="_blank" rel="noopener"><span class="at">${esc(a.title)}</span><span class="ad num">${esc(fd(dayKey(new Date(a.date)), { weekday: "short", day: "numeric", month: "short" }))}</span><span class="ax">${esc(a.excerpt.replace(/^…\s*/, ""))}</span></a>`).join("")}</div>` : ""}
    </div>`;
  document.getElementById("scrim").classList.add("open");
  d.classList.add("open");
  d.onscroll = () => document.getElementById("dtop").classList.toggle("scrolled", d.scrollTop > 72);
  document.body.style.overflow = "hidden";
}
function closeDrawer() {
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("scrim").classList.remove("open");
  document.body.style.overflow = "";
}

// ---- wiring ----
function render() {
  closePop();
  document.body.className = "v-" + S.view;
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.v === S.view));
  const courses = [...new Set(DATA.items.map((i) => i.course))].sort((a, b) => (a === "KTH") - (b === "KTH") || a.localeCompare(b));
  document.getElementById("filters").innerHTML = courses.map((c) => `<button class="filter${S.hidden.includes(c) ? " off" : ""}" data-course="${c}" aria-pressed="${!S.hidden.includes(c)}"><span class="dot" style="--c:${color(c)}"></span>${c}</button>`).join("");
  const m = DATA.meta || {};
  if (m.archive_retrieved_at) {
    const h = Math.round((Date.now() - new Date(m.archive_retrieved_at)) / 3600000), el = document.getElementById("synced");
    el.textContent = `Synced ${h < 1 ? "just now" : h < 24 ? `${h} h ago` : `${Math.round(h / 24)} d ago`}`;
    el.title = new Date(m.archive_retrieved_at).toLocaleString("en-GB", { timeZone: TZ });
  }
  document.getElementById("main").innerHTML = S.view === "month" ? month() : S.view === "week" ? week() : agenda();
  route();
}
let openId = null;
function route() {
  const m = location.hash.match(/^#\/item\/(.+)$/);
  if (m) { const id = decodeURIComponent(m[1]); if (id !== openId) { expanded = false; document.getElementById("drawer").scrollTop = 0; } openId = id; drawer(id); }
  else { openId = null; closeDrawer(); }
}
async function load() {
  try { DATA = await (await fetch("/api/items", { cache: "no-store" })).json(); render(); } catch {}
}
async function setDone(id, done) {
  const it = DATA.items.find((x) => x.id === id);
  it.done_override = done;
  render();
  await fetch(`/api/items/${encodeURIComponent(id)}/done`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ done }) });
}
function back() { history.length > 1 ? history.back() : (location.hash = ""); }
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-toggle],[data-reset],[data-close],[data-closepop],[data-expand],[data-pop],[data-id],[data-more],[data-day],[data-nav],[data-course],#tabs button,#showdone");
  if (!e.target.closest("#pop") && !e.target.closest("[data-pop]")) closePop();
  if (e.target.id === "scrim") return back();
  if (!t) return;
  if (t.dataset.toggle) { e.stopPropagation(); const it = DATA.items.find((x) => x.id === t.dataset.toggle); setDone(it.id, status(it) !== "done"); return; }
  if (t.dataset.reset) { setDone(t.dataset.reset, null); return; }
  if (t.dataset.close !== undefined) return back();
  if (t.dataset.closepop !== undefined) return closePop();
  if (t.dataset.expand !== undefined) { expanded = true; route(); return; }
  if (t.dataset.pop) { e.stopPropagation(); popover(t.dataset.pop, t); return; }
  if (t.dataset.id) { closePop(); location.hash = "#/item/" + encodeURIComponent(t.dataset.id); return; }
  if (t.dataset.more) { if (t.dataset.more === "older") showOlder = true; else showDeferred = true; render(); return; }
  if (t.dataset.day) { if (phone()) { selDay = t.dataset.day; render(); } return; }
  if (t.dataset.nav) {
    const n = Number(t.dataset.nav);
    if (n === 0) { cursor = new Date(); selDay = null; }
    else if (S.view === "month") { const c = new Date(cursor); c.setUTCDate(15); c.setUTCMonth(c.getUTCMonth() + n); cursor = c; selDay = null; }
    else cursor = new Date(cursor.getTime() + n * 7 * 86400000);
    render(); return;
  }
  if (t.dataset.course) { const c = t.dataset.course; S.hidden = S.hidden.includes(c) ? S.hidden.filter((x) => x !== c) : [...S.hidden, c]; save(); render(); return; }
  if (t.id === "showdone") { S.showDone = !S.showDone; save(); render(); return; }
  if (t.dataset.v) { S.view = t.dataset.v; save(); window.scrollTo(0, 0); render(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (document.getElementById("pop")) closePop(); else if (location.hash) back(); } });
window.addEventListener("hashchange", route);
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 150); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
render();
if (!window.__DATA__) load();
</script>
</body>
</html>
