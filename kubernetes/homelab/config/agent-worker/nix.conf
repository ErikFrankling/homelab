experimental-features = nix-command flakes
trusted-users = root
sandbox = true
sandbox-fallback = false
accept-flake-config = true

# Shares the node's 8 threads with the cluster and the nix-builder pod, with no
# CPU request: it only gets what nothing else wants.
max-jobs = 2
cores = 4

build-dir = /nix/var/worker/build

# The homelab cache first: it already holds the PC's whole closure, so a
# project devShell that matches the dotfiles' nixpkgs comes from the LAN.
substituters = https://nix-cache.erikfrankling.duckdns.org https://cache.nixos.org https://install.determinate.systems https://cache.numtide.com https://nix-community.cachix.org
trusted-public-keys = nix-cache.erikfrankling.duckdns.org-1:i1VytpUS/NiHyPJq8tWmvhrhfBL7L3+ZOcVYq2BXWdA= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= cache.flakehub.com-3:hJuILl5sVK4iKm86JzgdXW12Y2Hwd5G07qKtHTOcDCM= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
connect-timeout = 5
http-connections = 50
download-buffer-size = 524288000

# Same node disk as the nix-builder store, which collects below 110 GiB free.
# Collect here a little earlier, so the worker gives way first. Both stay above
# the 20% DiskFillingUp alert (config/prometheus/homelab.rules.yml).
min-free = 123480309760
max-free = 144955146240
