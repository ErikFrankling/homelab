# What Gatus checks (apps/gatus.yaml). This list is the definition of "Erik's
# setup works". The PC reads the results every two minutes and starts an agent
# session to repair any check that keeps failing (dotfiles repo,
# modules/home-manager/auto-update, `health-watch`). So: only add checks for
# things Erik really uses, and when something broke that no check caught, add
# the check that would have.
#
# Two vantage points:
# - group "phone": through the Tailscale sidecar's proxy, i.e. into the
#   tailnet and back out through the Proxmox subnet router. That is the path
#   subnet routing path, forced through an internet DERP relay. The probe is
#   still inside the house: it cannot test the phone's mobile network or DNS.
# - group "lan": from the k3s node's own network. Routes behind the
#   lan-only middleware are checked from "phone" only: from the node itself
#   the request reaches Traefik with an internal source address and gets 403.
storage:
  type: memory
concurrency: 0
# Prometheus metrics at :18080/metrics (gatus_results_*), so the planned
# alerting stack reads the same results health-watch does
# (docs/observability.md).
metrics: true
web:
  # The pod runs on the host network (apps/gatus.yaml); keep off 8080.
  port: 18080
ui:
  title: Homelab health
  header: Homelab health

endpoints:
  # ---- phone (through the tailnet) -----------------------------------------
  - name: t3code
    group: phone
    url: https://t3code.erikfrankling.duckdns.org/
    interval: 1m
    client:
      proxy-url: http://127.0.0.1:1055
      timeout: 20s
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 480h"
  # Check the actual live-connection route, not just the static HTML page.
  # HTTP Upgrade keeps this on Gatus's HTTP client, which honors proxy-url;
  # its native ws/wss client in v5.37.0 ignores that setting.
  # The query matters: the server answers 426 to clients without it.
  - name: t3code-websocket
    group: phone
    url: https://t3code.erikfrankling.duckdns.org/ws?orchestrationProtocol=2
    interval: 1m
    headers:
      Connection: Upgrade
      Upgrade: websocket
      Sec-WebSocket-Version: "13"
      Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==
      Origin: https://t3code.erikfrankling.duckdns.org
    client:
      proxy-url: http://127.0.0.1:1055
      timeout: 20s
    conditions:
      - "[STATUS] == 101"
  - name: vaultwarden
    group: phone
    url: https://vault.erikfrankling.duckdns.org/alive
    interval: 2m
    client:
      proxy-url: http://127.0.0.1:1055
      timeout: 20s
    conditions:
      - "[STATUS] == 200"
  - name: open-webui
    group: phone
    url: https://chat.erikfrankling.duckdns.org/
    interval: 2m
    client:
      proxy-url: http://127.0.0.1:1055
      timeout: 20s
    conditions:
      - "[STATUS] == 200"
  - name: openclaw
    group: phone
    url: https://claw.erikfrankling.duckdns.org/
    interval: 2m
    client:
      proxy-url: http://127.0.0.1:1055
      timeout: 20s
    conditions:
      - "[STATUS] == 200"
  - name: executor
    group: phone
    url: https://executor.erikfrankling.duckdns.org/health
    interval: 2m
    client:
      proxy-url: http://127.0.0.1:1055
      timeout: 20s
    conditions:
      - "[STATUS] == 200"
  - name: brain
    group: phone
    url: https://brain.erikfrankling.duckdns.org/health
    interval: 2m
    client:
      proxy-url: http://127.0.0.1:1055
      timeout: 20s
    conditions:
      - "[STATUS] == 200"
  - name: time
    group: phone
    url: https://time.erikfrankling.duckdns.org/
    interval: 2m
    client:
      proxy-url: http://127.0.0.1:1055
      timeout: 20s
    conditions:
      - "[STATUS] == 200"
  - name: nix-cache
    group: phone
    url: https://nix-cache.erikfrankling.duckdns.org/nix-cache-info
    interval: 5m
    client:
      proxy-url: http://127.0.0.1:1055
      timeout: 20s
    conditions:
      - "[STATUS] == 200"

  # ---- lan (from the node) -------------------------------------------------
  - name: t3code
    group: lan
    url: http://192.168.50.232:3773/
    interval: 1m
    conditions:
      - "[STATUS] == 200"
  - name: vaultwarden
    group: lan
    url: https://vault.erikfrankling.duckdns.org/alive
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      # Traefik renews at 30 days left; under 20 means renewal is failing.
      - "[CERTIFICATE_EXPIRATION] > 480h"
  - name: open-webui
    group: lan
    url: https://chat.erikfrankling.duckdns.org/
    interval: 2m
    conditions:
      - "[STATUS] == 200"
  # T3 Code's read-aloud voice while dictation holds the PC's GPU.
  - name: kokoro-tts
    group: lan
    url: http://192.168.50.100:8880/v1/audio/voices
    interval: 2m
    conditions:
      - "[STATUS] == 200"
  - name: nix-builder-ssh
    group: lan
    url: tcp://192.168.50.100:2222
    interval: 5m
    conditions:
      - "[CONNECTED] == true"
  - name: adguard-dns
    group: lan
    url: 192.168.50.100
    interval: 2m
    dns:
      query-name: vault.erikfrankling.duckdns.org
      query-type: A
    conditions:
      - "[DNS_RCODE] == NOERROR"
      - "[BODY] == 192.168.50.100"
  # The ad blocking itself, not just DNS answering: a known ad domain must
  # come back as the 0.0.0.0 block answer.
  - name: adguard-blocking
    group: lan
    url: 192.168.50.100
    interval: 5m
    dns:
      query-name: doubleclick.net
      query-type: A
    conditions:
      - "[BODY] == 0.0.0.0"
  # DuckDNS itself, asked from outside: every *.erikfrankling.duckdns.org
  # name must point at the homelab address (192.168.50.100).
  - name: duckdns
    group: lan
    url: 1.1.1.1
    interval: 5m
    dns:
      query-name: vault.erikfrankling.duckdns.org
      query-type: A
    conditions:
      - "[DNS_RCODE] == NOERROR"
      - "[BODY] == 192.168.50.100"
  # The PC's local model server: dictation's final pass, read-aloud summaries
  # and the big voice all go through it.
  - name: llama-swap
    group: lan
    url: http://192.168.50.232:8000/health
    interval: 2m
    conditions:
      - "[STATUS] == 200"
  - name: pc-ssh
    group: lan
    url: tcp://192.168.50.232:22
    interval: 2m
    conditions:
      - "[CONNECTED] == true"
  - name: proxmox
    group: lan
    url: https://192.168.50.10:8006/
    interval: 2m
    client:
      insecure: true
    conditions:
      - "[STATUS] == 200"
