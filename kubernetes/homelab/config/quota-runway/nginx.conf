pid /tmp/nginx.pid;
events {}
http {
  include /etc/nginx/mime.types;
  types { text/javascript mjs; }
  default_type application/octet-stream;
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8081;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self'; frame-ancestors 'self'";
    location = /runway { return 302 /runway/; }
    location /runway/ { alias /srv/; index index.html; }
    location / { return 404; }
  }
}
