version: 1
metadata:
  name: Homelab single sign-on
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: {name: Default - Authentication flow}
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: {name: Default - Provider authorization flow (implicit consent)}
  - model: authentik_stages_user_login.userloginstage
    identifiers: {name: default-authentication-login}
    attrs: {session_duration: 'days=30', remember_me_offset: 'days=60'}
  - model: authentik_flows.flow
    id: passkey-flow
    identifiers: {slug: homelab-passkey}
    attrs:
      name: Sign in with a passkey
      title: Sign in to your homelab
      designation: authentication
      authentication: none
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: passkey-validate
    identifiers: {name: homelab-passkey}
    attrs:
      device_classes: [webauthn]
      not_configured_action: deny
      webauthn_user_verification: required
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf passkey-flow
      stage: !KeyOf passkey-validate
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf passkey-flow
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
      order: 20
  - model: authentik_stages_identification.identificationstage
    identifiers: {name: default-authentication-identification}
    attrs:
      user_fields: [email, username]
      passwordless_flow: !KeyOf passkey-flow
  # Only the provisioned owner email is asserted verified. No public enrollment.
  - model: authentik_providers_oauth2.scopemapping
    id: owner-email
    identifiers: {name: Homelab owner email}
    attrs:
      scope_name: email
      expression: |
        return {"email": request.user.email, "email_verified": request.user.username == "akadmin" and request.user.attributes.get("homelab_email_verified", False)}
  - model: authentik_providers_oauth2.oauth2provider
    id: grafana-provider
    identifiers: {name: Grafana}
    attrs:
      client_id: homelab-grafana
      client_secret: !Env GRAFANA_CLIENT_SECRET
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: https://grafana.erikfrankling.duckdns.org/login/generic_oauth
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf owner-email
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: grafana-app
    identifiers: {slug: grafana}
    attrs: {name: Grafana, provider: !KeyOf grafana-provider}
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf grafana-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
  - model: authentik_providers_oauth2.oauth2provider
    id: keeper-provider
    identifiers: {name: CLIProxy usage}
    attrs:
      client_id: homelab-keeper
      client_secret: !Env KEEPER_CLIENT_SECRET
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: https://cliproxy-usage.erikfrankling.duckdns.org/api/v1/auth/oidc/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf owner-email
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: keeper-app
    identifiers: {slug: keeper}
    attrs: {name: CLIProxy usage, provider: !KeyOf keeper-provider}
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf keeper-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
  - model: authentik_providers_proxy.proxyprovider
    id: adguard-provider
    identifiers: {name: AdGuard}
    attrs:
      mode: forward_single
      external_host: https://adguard.erikfrankling.duckdns.org
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    id: adguard-app
    identifiers: {slug: adguard}
    attrs: {name: AdGuard, provider: !KeyOf adguard-provider}
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf adguard-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
  - model: authentik_providers_proxy.proxyprovider
    id: home-provider
    identifiers: {name: Home}
    attrs:
      mode: forward_single
      external_host: https://home.erikfrankling.duckdns.org
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    id: home-app
    identifiers: {slug: home}
    attrs: {name: Home, provider: !KeyOf home-provider}
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf home-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
  - model: authentik_providers_proxy.proxyprovider
    id: chat-provider
    identifiers: {name: Chat}
    attrs:
      mode: forward_single
      external_host: https://chat.erikfrankling.duckdns.org
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    id: chat-app
    identifiers: {slug: chat}
    attrs: {name: Chat, provider: !KeyOf chat-provider}
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf chat-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
  - model: authentik_outposts.outpost
    identifiers: {managed: goauthentik.io/outposts/embedded}
    attrs:
      providers: [!KeyOf adguard-provider, !KeyOf home-provider, !KeyOf chat-provider]
      config:
        authentik_host: https://auth.erikfrankling.duckdns.org
  - model: authentik_providers_oauth2.oauth2provider
    id: executor-provider
    identifiers: {name: Executor}
    attrs:
      client_id: homelab-executor
      client_secret: !Env EXECUTOR_CLIENT_SECRET
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: https://executor.erikfrankling.duckdns.org/api/auth/oauth2/callback/sso
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf owner-email
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: executor-app
    identifiers: {slug: executor}
    attrs: {name: Executor, provider: !KeyOf executor-provider}
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf executor-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
  - model: authentik_core.user
    identifiers: {username: akadmin}
    attrs:
      name: Erik
      email: !Env AUTHENTIK_BOOTSTRAP_EMAIL
      attributes: {homelab_email_verified: true}
