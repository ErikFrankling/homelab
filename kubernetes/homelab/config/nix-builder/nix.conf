experimental-features = nix-command flakes
trusted-users = root
sandbox = true
sandbox-fallback = false

# 8 host threads shared with the whole cluster. The pod has no CPU request, so
# under contention the kernel gives it the smallest share; oversubscribing here
# only costs the builds themselves.
max-jobs = 4
cores = 4

# Build trees go to the volume, not the container's writable layer, which the
# kubelet counts as ephemeral storage.
build-dir = /nix/var/builder/build

# Same caches the NixOS hosts use (dotfiles modules/nixos/default.nix), so the
# builder fetches exactly what they would have and compiles only the rest.
substituters = https://cache.nixos.org https://install.determinate.systems https://cache.numtide.com https://nix-community.cachix.org
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= cache.flakehub.com-3:hJuILl5sVK4iKm86JzgdXW12Y2Hwd5G07qKtHTOcDCM= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
http-connections = 50
download-buffer-size = 524288000

# The volume is the node's root disk, and local-path enforces no quota. This
# is the backstop that keeps the store from pushing the node into disk
# pressure: below 40 GiB free on that disk, collect until 60 GiB is free. The
# nightly job also prunes its own roots; see docs/nix-builder.md.
min-free = 42949672960
max-free = 64424509440
