experimental-features = nix-command flakes
trusted-users = root
sandbox = true
sandbox-fallback = false

# 8 host threads shared with the whole cluster. The pod has no CPU request, so
# under contention the kernel gives it the smallest share; oversubscribing here
# only costs the builds themselves.
max-jobs = 4
cores = 4

# Build trees go to the volume, not the container's writable layer, which the
# kubelet counts as ephemeral storage.
build-dir = /nix/var/builder/build

# Same caches the NixOS hosts use (dotfiles modules/nixos/default.nix), so the
# builder fetches exactly what they would have and compiles only the rest.
substituters = https://cache.nixos.org https://install.determinate.systems https://cache.numtide.com https://nix-community.cachix.org
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= cache.flakehub.com-3:hJuILl5sVK4iKm86JzgdXW12Y2Hwd5G07qKtHTOcDCM= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
http-connections = 50
download-buffer-size = 524288000

# The volume is the node's root disk, and local-path enforces no quota. This
# is only the emergency backstop: below 50 GiB free (above the kubelet's
# ~35 GiB DiskPressure eviction line; the worker gives way first at 90).
# The disk is shared, and most of it is not this store: on 2026-11-18 Nix
# held ~30-75 GiB of 697. At 80 GiB the other tenants pushed the disk below
# min-free, and every Nix process then ran its own GC in turn under the
# exclusive GC lock, could not get back above 80, and no build compiled for
# ~90 minutes. Keep min-free a last resort. Routine collection
# is the nightly job's, before its builds (below 150 GiB free; dotfiles
# auto-update). At 150 GiB here (until 2026-11-09) the disk sat below it on
# live data, so every remote build and every `nix copy` started a full GC
# that could not reach 175 GiB and held the GC lock: `nix __build-remote`
# from the PC hung for 20 minutes. Keep min-free reachable.
#
# max-free is where a triggered collection stops. At 90 GiB (until
# 2026-11-18) each one freed only ~10 GiB, so during the wasm-box port builds
# the store sat at 88-91% with a GC starting every few builds, and the writes
# outran it until the node hit the kubelet's DiskPressure line and every pod
# was evicted. Collecting to 150 GiB buys a real margin per run; if there is
# less garbage than that, the GC frees what there is and stops, and the next
# one only starts below min-free again.
min-free = 53687091200
max-free = 161061273600
