pid /tmp/nginx.pid;
events {}
http {
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8080;
    default_type text/html;
    root /srv;
    location = /login { try_files /index.html =404; }
    location / { return 404; }
  }
}
