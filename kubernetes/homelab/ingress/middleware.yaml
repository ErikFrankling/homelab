apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
spec:
  ipAllowList:
    sourceRange:
      - 192.168.50.0/24
      - 100.64.0.0/10
      - 127.0.0.1/32
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-and-cluster
spec:
  ipAllowList:
    sourceRange:
      - 192.168.50.0/24
      - 100.64.0.0/10
      - 10.42.0.0/16
      - 10.43.0.0/16
      - 127.0.0.1/32
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: homelab-sso
spec:
  forwardAuth:
    address: http://authentik-server/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: false
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-email
      - X-authentik-groups
      - X-authentik-uid
