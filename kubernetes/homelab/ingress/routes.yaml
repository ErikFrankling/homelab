apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homelab
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`traefik.erikfrankling.duckdns.org`)
      middlewares:
        - name: lan-only
      services:
        - kind: TraefikService
          name: api@internal
    - kind: Rule
      match: Host(`adguard.erikfrankling.duckdns.org`)
      middlewares:
        - name: lan-only
      services:
        - name: adguard
          port: 80
    - kind: Rule
      match: Host(`vault.erikfrankling.duckdns.org`)
      services:
        - name: vaultwarden
          port: 80
    - kind: Rule
      match: Host(`chat.erikfrankling.duckdns.org`)
      services:
        - name: openwebui
          port: 8080
    - kind: Rule
      match: Host(`claw.erikfrankling.duckdns.org`)
      middlewares:
        - name: lan-only
      services:
        - name: openclaw
          port: 18789
    # Executor holds OAuth tokens for every connected account and proxies the
    # PC's computer-use MCP. lan-only is load-bearing: never expose it.
    - kind: Rule
      match: Host(`executor.erikfrankling.duckdns.org`)
      middlewares:
        - name: lan-only
      services:
        - name: executor
          port: 80
    # The company brain: how things are done on these machines. Not secret by
    # design, but internal. lan-and-cluster because Executor's brain app
    # reaches it from inside the cluster by this name.
    - kind: Rule
      match: Host(`brain.erikfrankling.duckdns.org`)
      middlewares:
        - name: lan-and-cluster
      services:
        - name: brain
          port: 80
    # This endpoint receives screenshots of whatever is on screen. lan-only is
    # load-bearing here, not defence in depth -- it must never be reachable
    # from the internet.
    - kind: Rule
      match: Host(`time.erikfrankling.duckdns.org`)
      middlewares:
        - name: lan-only
      services:
        - name: time
          port: 80
    # Nix binary cache (apps/nix-builder.yaml).
    # Everything in it is signed and none of it is secret, but the store holds
    # private configuration, so it stays on the LAN and the tailnet.
    - kind: Rule
      match: Host(`nix-cache.erikfrankling.duckdns.org`)
      middlewares:
        - name: lan-only
      services:
        - name: nix-builder
          port: 5000
    # Signed JS updates for the T3 Code Android app (apps/t3-updates.yaml).
    # Public data, but the phone reaches it over the tailnet like T3 Code.
    - kind: Rule
      match: Host(`t3-updates.erikfrankling.duckdns.org`)
      middlewares:
        - name: lan-only
      services:
        - name: t3-updates
          port: 80
    # Push notifications to Erik's phone (apps/ntfy.yaml). The phone keeps a
    # websocket open over the tailnet; Executor's `notify` app publishes from
    # inside the cluster by this name, hence lan-and-cluster. ntfy itself
    # also denies everything without a login or token.
    - kind: Rule
      match: Host(`ntfy.erikfrankling.duckdns.org`)
      middlewares:
        - name: lan-and-cluster
      services:
        - name: ntfy
          port: 80
    # Observability (docs/observability.md). Grafana: read-only without a
    # login for the phone. Prometheus and Alertmanager: health-watch on the pc
    # polls Alertmanager's API.
    - kind: Rule
      match: Host(`grafana.erikfrankling.duckdns.org`)
      middlewares:
        - name: lan-only
      services:
        - name: grafana
          port: 80
    - kind: Rule
      match: Host(`prometheus.erikfrankling.duckdns.org`)
      middlewares:
        - name: lan-only
      services:
        - name: prometheus
          port: 9090
    - kind: Rule
      match: Host(`alertmanager.erikfrankling.duckdns.org`)
      middlewares:
        - name: lan-only
      services:
        - name: alertmanager
          port: 9093
    # The OTLP ingest for the pc, the laptop and the phone (OTLP/HTTP only).
    # Alloy checks a bearer token on this port (secrets/otlp-ingest.enc.yaml).
    - kind: Rule
      match: Host(`otlp.erikfrankling.duckdns.org`)
      middlewares:
        - name: lan-only
      services:
        - name: alloy
          port: 14318
