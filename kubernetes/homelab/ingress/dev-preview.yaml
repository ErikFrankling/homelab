# Phone previews of the dev servers agents start on the GPU/PC box. Any
# pc-<port>.erikfrankling.duckdns.org goes to one Caddy on the PC
# (192.168.50.232:3999), which reads the port out of the hostname, checks it
# against an allowlist of dev-server ports and proxies to localhost:<port>
# (dotfiles repo, modules/nixos/dev-preview.nix). Dev servers stay on
# loopback, and the PC firewall admits :3999 only from the k3s node and VIP.
#
# Traefik cannot turn a hostname into a backend port, hence the one catch-all
# route plus the proxy. `pc-<port>` is a single label on purpose: the existing
# *.erikfrankling.duckdns.org cert covers it and the DuckDNS wildcard already
# resolves it, so nothing else changes. Named routes (t3code., opencode., ...)
# never match the pattern. lan-only keeps it to the LAN and the tailnet.
apiVersion: v1
kind: Service
metadata:
  name: external-dev-preview-pc
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: external-dev-preview-pc
  labels:
    kubernetes.io/service-name: external-dev-preview-pc
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.50.232
    conditions:
      ready: true
ports:
  - name: http
    port: 3999
    protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dev-preview
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: HostRegexp(`^pc-[0-9]+\.erikfrankling\.duckdns\.org$`)
      middlewares:
        - name: lan-only
      services:
        - name: external-dev-preview-pc
          port: 80
