apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cluster-experiments
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`naiaclaw-api.erikfrankling.duckdns.org`)
      middlewares:
        - name: lan-only
      services:
        - name: external-naiaclaw-api
          port: 80
    - kind: Rule
      match: Host(`p9eval.erikfrankling.duckdns.org`)
      middlewares:
        - name: lan-only
      services:
        - name: external-p9-eval
          port: 80
    - kind: Rule
      match: Host(`planet9-test.erikfrankling.duckdns.org`)
      middlewares:
        - name: lan-only
      services:
        - name: external-p9-mcp-test
          port: 80
    - kind: Rule
      match: Host(`registry.erikfrankling.duckdns.org`)
      middlewares:
        - name: lan-and-cluster
      services:
        - name: external-p9-registry
          port: 80
---
# opencode web/agent server runs on the GPU/PC box (192.168.50.232:4096),
# outside the cluster. Routed here so it is reachable at its own HTTPS origin
# (opencode.erikfrankling.duckdns.org) with the wildcard cert -- same-origin
# access avoids opencode's cross-origin browser pairing prompt. lan-only keeps
# it to the LAN and the 10.8.0.0/24 VPN; the server itself is unsecured.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: opencode
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`opencode.erikfrankling.duckdns.org`)
      middlewares:
        - name: lan-only
      services:
        - name: external-opencode-pc
          port: 80
