apiVersion: v1
kind: Service
metadata:
  name: external-naiaclaw-api
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: external-naiaclaw-api
  labels:
    kubernetes.io/service-name: external-naiaclaw-api
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.50.200
    conditions:
      ready: true
