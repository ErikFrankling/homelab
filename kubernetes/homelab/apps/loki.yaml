# Loki: logs from every host and pod, and the log-based alert rules
# (config/loki/, docs/observability.md). Ops logs 30 days; Time's activity
# events 5 years. Back up this volume: it is the raw copy of Time's data.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: loki
          image: docker.io/grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - {containerPort: 3100, name: http}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 20
            initialDelaySeconds: 15
          resources:
            limits:
              memory: 1536Mi
            requests:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - {name: config, mountPath: /etc/loki/loki.yaml, subPath: loki.yaml, readOnly: true}
            # Ruler rules, tenant "fake" (auth disabled).
            - {name: rules, mountPath: /etc/loki/rules/fake, readOnly: true}
            - {name: data, mountPath: /loki}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: rules
          configMap:
            name: loki-rules
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
spec:
  selector:
    app.kubernetes.io/name: loki
  ports:
    - {name: http, port: 3100, targetPort: http}
