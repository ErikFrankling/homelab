apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openwebui-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: openwebui
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openwebui
    spec:
      automountServiceAccountToken: false
      containers:
        - name: openwebui
          image: ghcr.io/open-webui/open-webui:latest-slim@sha256:6ca12fadd11cb6565b7fa98c4001e860b2ef9df2bfcb18d380c75d1994138b0c
          imagePullPolicy: IfNotPresent
          env:
            - name: ENABLE_RAG_WEB_SEARCH
              value: "True"
            - name: RAG_WEB_SEARCH_CONCURRENT_REQUESTS
              value: "10"
            - name: RAG_WEB_SEARCH_ENGINE
              value: searxng
            - name: RAG_WEB_SEARCH_RESULT_COUNT
              value: "5"
            - name: SEARXNG_QUERY_URL
              value: http://searxng:8080/search?q=<query>
            - name: WEBUI_AUTH
              value: "false"
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            failureThreshold: 12
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts:
            - mountPath: /app/backend/data
              name: data
      terminationGracePeriodSeconds: 60
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openwebui-data
---
apiVersion: v1
kind: Service
metadata:
  name: openwebui
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/name: openwebui
