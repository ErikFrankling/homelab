# CPA Usage Keeper (https://github.com/Willxup/cpa-usage-keeper): usage history,
# cost and per-account quota dashboard for CLIProxyAPI (apps/cliproxy.yaml).
# It reads the proxy's management API and drains its usage queue (RESP on the
# same port 8317) into SQLite on the PVC, which the proxy itself does not keep.
# https://cliproxy-usage.erikfrankling.duckdns.org (lan-only). AUTH_ENABLED=false
# is the supported private-network mode: no separate dashboard login.
#
# The image's entrypoint chowns /data and drops to its own user with su-exec,
# which needs root; we run the binary directly as uid 1000 instead and let
# fsGroup make the PVC writable.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cpa-usage-keeper-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpa-usage-keeper
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cpa-usage-keeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cpa-usage-keeper
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: keeper
          image: ghcr.io/willxup/cpa-usage-keeper:v2.0.3@sha256:e56daad41fea07eff80045b0efb41f4c80f092ab3e87090a4089e0446cfe6855
          imagePullPolicy: IfNotPresent
          command: ["/app/cpa-usage-keeper"]
          workingDir: /data
          env:
            - name: TZ
              value: Europe/Stockholm
            - name: WORK_DIR
              value: /data
            - name: CPA_BASE_URL
              value: http://cliproxy:8317
            - name: CPA_PUBLIC_URL
              value: https://cliproxy.erikfrankling.duckdns.org
            - name: TRUSTED_PROXY_CIDRS
              value: 10.42.0.0/16
            - name: AUTH_ENABLED
              value: "false"
          envFrom:
            - secretRef:
                name: cpa-usage-keeper
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            limits:
              memory: 512Mi
            requests:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cpa-usage-keeper-data
---
apiVersion: v1
kind: Service
metadata:
  name: cpa-usage-keeper
spec:
  selector:
    app.kubernetes.io/name: cpa-usage-keeper
  ports:
    - name: http
      port: 80
      targetPort: http
