# Executor 2 (https://executor.sh): one MCP endpoint in front of every app,
# shared by all agents. Integrations are Executor "apps" (TypeScript, or an MCP
# server by URL); each app can also ship Agent Skills, which agents read with
# the endpoint's `skills` tool. The dashboard, API and MCP (/mcp) are one
# process over an embedded PGlite database in /app/data, which also holds the
# generated session secret and the encryption key for stored credentials --
# losing the PV loses every connected account.
#
# Executor 1 kept its SQLite data on the executor-data PV. That PV is left in
# place (not mounted) so 1.6 can be restored by reverting this file; Executor 2
# cannot read it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: executor-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: executor-v2-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: executor
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: executor
    spec:
      automountServiceAccountToken: false
      priorityClassName: homelab-core
      containers:
        - name: executor
          image: ghcr.io/usefulsoftwareco/executor-selfhost:2.0.0-beta.24@sha256:39d8ce360adf86df46e953f43551dad4440d04d7246d30fc7b0d6f3f5cfed3f7
          imagePullPolicy: IfNotPresent
          env:
            # Must match the URL browsers load exactly, or sign-in fails with
            # an invalid-origin error.
            - name: BETTER_AUTH_URL
              value: https://executor.erikfrankling.duckdns.org
            # App code may only fetch public addresses by default. The brain
            # app (brain.erikfrankling.duckdns.org) and the PC's computer-use
            # MCP (192.168.50.232) are on the LAN. This lets every app reach
            # the LAN; acceptable because the only account is the owner's and
            # the route is lan-only.
            - name: EXECUTOR_APPS_ALLOW_PRIVATE_FETCH
              value: "true"
            - name: DO_NOT_TRACK
              value: "1"
          ports:
            - containerPort: 4400
              name: http
              protocol: TCP
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          # A wedged process answers nothing, not slowly, and every new agent
          # session started meanwhile loses Executor. Kill it after a minute
          # rather than 2.5 (2026-11-02: not ready 02:46-02:48 UTC).
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              memory: 3Gi
            requests:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            # The image's `executor` user; its entrypoint skips the root-only
            # volume preparation when started as this user.
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /app/data
              name: data
            # Traces from the bundled Motel collector; disposable.
            - mountPath: /app/motel-data
              name: motel
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: executor-v2-data
        - name: motel
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: executor
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/name: executor
---
# Upstream leak: executor-selfhost memory grows with uptime until restart
# (UsefulSoftwareCo/executor#2216, open, no fix in the notes up to beta.34). Here
# it reached the 3Gi limit after 2-4 days, then reclaim thrashed page cache and
# /health stopped answering. No OOM kill, so the outage lasted until the liveness
# probe fired, and agent sessions starting during it lost their tools.
#
# executor-recycler restarts it cleanly before it gets there. The threshold is on
# memory, not a clock, because growth tracks agent traffic (50-140 MB/h) and a
# restart drops running executions and paused approvals (executor#2449). The data
# on the PV is untouched. Remove all of this once #2216 is fixed.
#
# Its Role and RoleBinding are in kubernetes/bootstrap/namespace-rbac.yaml: Flux's
# reconciler may not bind roles, so a binding in this file stops all of homelab.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: executor-recycler
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: executor-recycler-scripts
data:
  recycle.sh: |
    set -eu

    # Anything but one plain Mi number (metrics down, two pods mid-rollout) fails
    # the job, which CronJobFailing reports, rather than restarting by accident.
    usage=$(kubectl top pod -n homelab -l app.kubernetes.io/name=executor --no-headers | awk '{print $3}')
    mebibytes=${usage%Mi}
    case "$mebibytes" in
      "" | *[!0-9]*)
        echo "cannot read executor memory: '${usage}'" >&2
        exit 1
        ;;
    esac

    if [ "$mebibytes" -lt "$THRESHOLD_MI" ]; then
      echo "executor at ${mebibytes}Mi, below ${THRESHOLD_MI}Mi"
      exit 0
    fi

    echo "executor at ${mebibytes}Mi, restarting"
    kubectl rollout restart -n homelab deployment/executor ${DRY_RUN:+--dry-run=server}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: executor-recycler
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  schedule: "*/15 * * * *"
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: executor-recycler
          containers:
            - name: recycler
              image: alpine/k8s:1.35.5@sha256:d870622d004031c4e3ddad80d200692792509176db03c346a8526f4f45476e96
              command:
                - /bin/sh
                - /scripts/recycle.sh
              env:
                # Working set against the 3Gi limit: over 4 hours of margin at
                # the fastest growth seen.
                - name: THRESHOLD_MI
                  value: "2400"
                # kubectl's discovery cache; the root filesystem is read-only.
                - name: HOME
                  value: /tmp
              resources:
                limits:
                  memory: 128Mi
                requests:
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 1000
                runAsNonRoot: true
                runAsUser: 1000
              volumeMounts:
                - mountPath: /scripts
                  name: scripts
                  readOnly: true
                - mountPath: /tmp
                  name: tmp
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: scripts
              configMap:
                defaultMode: 365
                name: executor-recycler-scripts
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
