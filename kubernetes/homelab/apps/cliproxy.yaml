# CLIProxyAPI (https://github.com/router-for-me/CLIProxyAPI): the one place
# Erik's Claude and Codex subscriptions are signed in. It keeps each account's
# OAuth grant fresh and serves one Anthropic/OpenAI-compatible endpoint that
# every Claude Code, Codex and T3 Code on the PC and the laptop points at
# (https://cliproxy.erikfrankling.duckdns.org, lan-only = LAN + Tailscale).
# All upstream traffic leaves from the home IP. Setup and logins:
# docs/cliproxy.md.
#
# config.yaml comes from the cliproxy secret and is copied over the PVC copy
# on every start (the server rewrites its config file, e.g. to hash the
# management key, so it must be writable). The account logins (auths/*.json)
# live only on the PVC: losing it means signing every account in again.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cliproxy-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliproxy
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cliproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cliproxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: config
          image: docker.io/eceasy/cli-proxy-api:v8.0.64@sha256:362e7ac699a0f2608d7c55f8f8cb764e5afbfe4ed22aadc26fcb147eecbf2a03
          command:
            - sh
            - -c
            - mkdir -p /data/auths && cp /config/config.yaml /data/config.yaml && chmod 600 /data/config.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
      containers:
        - name: cliproxy
          image: docker.io/eceasy/cli-proxy-api:v8.0.64@sha256:362e7ac699a0f2608d7c55f8f8cb764e5afbfe4ed22aadc26fcb147eecbf2a03
          imagePullPolicy: IfNotPresent
          workingDir: /data
          command: ["/CLIProxyAPI/CLIProxyAPI", "-config", "/data/config.yaml"]
          env:
            - name: TZ
              value: Europe/Stockholm
            - name: HOME
              value: /data
            # Each in-flight /v1/messages holds the whole request body (Claude
            # Code sends multi-MB contexts) plus its parsed and translated
            # copies. At 512Mi a fleet of ~16 Opus agents with sub-agents
            # (2026-11-09 20:45) OOM-killed it every few minutes, dropping
            # every stream (502/503). The soft limit makes Go collect hard
            # before the cgroup limit instead of overshooting it.
            - name: GOMEMLIMIT
              value: 1536MiB
          ports:
            - containerPort: 8317
              name: http
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cliproxy-data
        - name: config
          secret:
            secretName: cliproxy
---
apiVersion: v1
kind: Service
metadata:
  name: cliproxy
spec:
  selector:
    app.kubernetes.io/name: cliproxy
  ports:
    - name: http
      port: 8317
      targetPort: http
