# Automatic shared login; upstream has no auto-entry setting. No credentials here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor-login
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: executor-login
  template:
    metadata:
      labels:
        app.kubernetes.io/name: executor-login
    spec:
      automountServiceAccountToken: false
      containers:
        - name: management
          image: docker.io/library/executor-login-network:953fb244-1
          imagePullPolicy: IfNotPresent
          command: ["nginx", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /login
              port: http
          resources:
            requests:
              memory: 8Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: config
              mountPath: /srv/index.html
              subPath: index.html
      volumes:
        - name: config
          configMap:
            name: executor-login
---
apiVersion: v1
kind: Service
metadata:
  name: executor-login
spec:
  selector:
    app.kubernetes.io/name: executor-login
  ports:
    - name: http
      port: 8080
      targetPort: http
