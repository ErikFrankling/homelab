# Alloy gateway: the OTLP ingest for everything, and the k3s pod logs
# (config/alloy/config.alloy, docs/observability.md). Cluster-wide read access
# for the pod logs comes from kubernetes/bootstrap/observability-rbac.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alloy-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
    spec:
      serviceAccountName: alloy
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
      containers:
        - name: alloy
          image: docker.io/grafana/alloy:v1.21.0@sha256:9726bfba078de9bc2212c60c6e643238c700b4fe0868ea78cbe03163d03d95bf
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
            - --server.http.listen-addr=0.0.0.0:12345
            # otelcol.storage.file (the persistent Time queue) is public preview.
            - --stability.level=public-preview
          envFrom:
            - secretRef:
                name: otlp-ingest
          ports:
            - {containerPort: 12345, name: http}
            - {containerPort: 4318, name: otlp-external}
            - {containerPort: 4320, name: otlp-http}
            - {containerPort: 4317, name: otlp-grpc}
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 20
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - {name: config, mountPath: /etc/alloy, readOnly: true}
            - {name: data, mountPath: /var/lib/alloy}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          persistentVolumeClaim:
            claimName: alloy-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
spec:
  selector:
    app.kubernetes.io/name: alloy
  ports:
    - {name: http, port: 12345, targetPort: http}
    # In-cluster OTLP without a token: alloy.homelab:4318 / :4317.
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    # Token-checked OTLP, only for the Traefik route.
    - {name: otlp-external, port: 14318, targetPort: otlp-external}
