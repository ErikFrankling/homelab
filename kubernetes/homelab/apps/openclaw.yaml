apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: openclaw
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openclaw
    spec:
      automountServiceAccountToken: false
      containers:
        - name: openclaw
          image: ghcr.io/openclaw/openclaw:2026.5.28@sha256:dbad4655fb87aa8d8662323daf9f46f4721504324e22c9f99d84849e609f5b2c
          imagePullPolicy: IfNotPresent
          # Upstream permits auth=none only on loopback; the sidecar serves the private route.
          command: ["node", "dist/index.js"]
          args: ["gateway", "--allow-unconfigured", "--bind", "loopback", "--auth", "none"]
          env:
            - name: OPENCLAW_DISABLE_BONJOUR
              value: "1"
            - name: SEARXNG_BASE_URL
              value: http://searxng:8080
          envFrom:
            - secretRef:
                name: openclaw-env
          ports:
            - containerPort: 18790
              name: http
              protocol: TCP
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            failureThreshold: 12
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            limits:
              memory: 1536Mi
            requests:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts:
            - mountPath: /home/node/.openclaw
              name: data
        - name: private-network
          image: nginx:1.31-alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
          command: ["nginx", "-g", "daemon off;"]
          resources:
            requests:
              memory: 8Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: private-network
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      hostAliases:
        - hostnames:
            - host.docker.internal
          ip: 192.168.50.100
        - hostnames:
            - gpu
          ip: 192.168.50.232
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 60
      volumes:
        - name: private-network
          configMap:
            name: openclaw-private-network
        - name: data
          persistentVolumeClaim:
            claimName: openclaw-data
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw
spec:
  externalTrafficPolicy: Local
  ports:
    - name: http
      port: 18789
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/name: openclaw
  type: LoadBalancer

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-private-network
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events {}
    http {
      access_log off;
      client_body_temp_path /tmp/client;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      map $http_upgrade $connection_upgrade { default upgrade; '' close; }
      server {
        listen 18790;
        location / {
          proxy_pass http://127.0.0.1:18789;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_read_timeout 3600s;
        }
      }
    }
