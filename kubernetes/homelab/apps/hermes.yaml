apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      automountServiceAccountToken: false
      containers:
        - name: hermes
          image: ghcr.io/erikfrankling/homelab-hermes:hermes-43bca6d@sha256:773c53b65413dc8063db40c95e3b28337e8cb4fa4713a8691599cf318bf08a5d
          imagePullPolicy: IfNotPresent
          args:
            - hermes
            - gateway
            - run
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  key: TZ
                  name: homelab-config
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /opt/data
              name: data
      hostAliases:
        - hostnames:
            - gpu
          ip: 192.168.50.232
      terminationGracePeriodSeconds: 60
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
