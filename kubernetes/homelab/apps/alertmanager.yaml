# Alertmanager: routes alerts to Erik's phone through Discord (ntfy mirror)
# (config/alertmanager/alertmanager.yml for the policy). health-watch on the
# pc polls its API to start repair sessions (docs/observability.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: docker.io/prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.external-url=https://alertmanager.erikfrankling.duckdns.org
            # Single instance: no gossip cluster.
            - --cluster.listen-address=
          ports:
            - {containerPort: 9093, name: http}
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 60
            failureThreshold: 5
          resources:
            limits:
              memory: 128Mi
            requests:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - {name: config, mountPath: /etc/alertmanager, readOnly: true}
            - {name: ntfy, mountPath: /etc/alertmanager/ntfy, readOnly: true}
            - {name: discord, mountPath: /etc/alertmanager/discord, readOnly: true}
            - {name: data, mountPath: /alertmanager}
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        # ntfy user `alerts`, write-only on topic erik (docs/notifications.md).
        - name: ntfy
          secret:
            secretName: alerts-ntfy
            items:
              - {key: NTFY_TOKEN, path: NTFY_TOKEN}
        # Discord webhook of #notifications and the @mention template
        # (docs/notifications.md); same webhook as notify-erik.
        - name: discord
          secret:
            secretName: alerts-discord
        - name: data
          persistentVolumeClaim:
            claimName: alertmanager-data
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
spec:
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - {name: http, port: 9093, targetPort: http}
