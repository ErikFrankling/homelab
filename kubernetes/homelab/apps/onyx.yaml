# Onyx (github.com/onyx-dot-app/onyx, MIT): one search over everything Erik has
# (mail, agent sessions, notes, Drive, GitHub, Canvas archive, X/Discord via
# x-graph, the company brain). Hybrid keyword + vector search in OpenSearch,
# connectors in the background workers, and an MCP server (/mcp/) that agents
# call with one tool, search_indexed_documents. Web UI and admin at
# https://search.erikfrankling.duckdns.org (lan-and-cluster).
#
# This is upstream's docker-compose.yml as plain manifests, not the Helm chart:
# the chart installs the CloudNativePG and Redis operators (cluster-scoped CRDs
# the homelab reconciler may not create) and splits the Celery workers into a
# dozen pods. Here the background pod runs every worker under supervisord, one
# model server serves both queries and indexing, and files live in Postgres
# (FILE_STORE_BACKEND=postgres) so there is no object store.
#
# Sources that have no built-in connector (T3/Claude/Codex sessions, Obsidian,
# the Canvas archive, x-graph, the brain) are pushed by the PC through the
# ingestion API: ~/.dotfiles search-sync (docs/search.md).
#
# Upgrade: bump the three onyx images together (same tag); the api pod runs the
# alembic migrations on start.
#
# CPU requests are 2m on purpose: the node is ~99% CPU-requested (mostly
# naiaclaw tenant pods), and a Pending pod blocks the whole Kustomization.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: onyx-db
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 40Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: onyx-opensearch
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: onyx-models
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: onyx-env
data:
  AUTH_TYPE: basic
  WEB_DOMAIN: https://search.erikfrankling.duckdns.org
  FILE_STORE_BACKEND: postgres
  POSTGRES_HOST: onyx-db
  POSTGRES_USER: postgres
  OPENSEARCH_HOST: onyx-opensearch
  REDIS_HOST: onyx-cache
  MODEL_SERVER_HOST: onyx-model
  INDEXING_MODEL_SERVER_HOST: onyx-model
  API_SERVER_PROTOCOL: http
  API_SERVER_HOST: onyx-api
  INTERNAL_URL: http://onyx-api:8080
  MCP_SERVER_ENABLED: "true"
  MCP_SERVER_PORT: "8090"
  ENABLE_CRAFT: "false"
  DISABLE_TELEMETRY: "true"
  LOG_LEVEL: info
  # One person, a CPU shared with everything else: keep the workers few.
  CELERY_WORKER_DOCFETCHING_CONCURRENCY: "1"
  CELERY_WORKER_DOCPROCESSING_CONCURRENCY: "2"
  CELERY_WORKER_LIGHT_CONCURRENCY: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onyx-db
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: onyx-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onyx-db
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: docker.io/library/postgres:15.2-alpine@sha256:d9c304353c031b21e9a7e33dc4781e272a9fa802a2ab9703fe4199d72ba1422c
          args: ["-c", "max_connections=250"]
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: onyx
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 10
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: onyx-db
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: onyx-db
spec:
  selector:
    app.kubernetes.io/name: onyx-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onyx-opensearch
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: onyx-opensearch
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onyx-opensearch
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: opensearch
          image: docker.io/opensearchproject/opensearch:3.6.0@sha256:b5dd1512af2a99748c942cfbbd7f32162623336b210667d0fc6333c6321f171d
          env:
            - name: discovery.type
              value: single-node
            # No memlock ulimit in a pod; the node has no swap anyway.
            - name: bootstrap.memory_lock
              value: "false"
            - name: OPENSEARCH_JAVA_OPTS
              value: -Xms2g -Xmx2g
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: onyx
                  key: OPENSEARCH_ADMIN_PASSWORD
          ports:
            - containerPort: 9200
              name: http
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              memory: 3Gi
            limits:
              memory: 6Gi
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: onyx-opensearch
---
apiVersion: v1
kind: Service
metadata:
  name: onyx-opensearch
spec:
  selector:
    app.kubernetes.io/name: onyx-opensearch
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onyx-cache
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: onyx-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onyx-cache
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: docker.io/library/redis:7.4-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: onyx-cache
spec:
  selector:
    app.kubernetes.io/name: onyx-cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# Onyx's own model server: the indexing pipeline's helpers (and the fallback
# embedder). Document and query embeddings come from onyx-embed below: the
# PyTorch in this image has no kernels for the GTX 1060 (sm_61), and on CPU
# the busy node embedded only 1-2 chunks/s. The HuggingFace cache persists so
# restarts do not download.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onyx-model
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: onyx-model
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onyx-model
    spec:
      automountServiceAccountToken: false
      containers:
        - name: model-server
          image: docker.io/onyxdotapp/onyx-model-server:v4.9.6@sha256:458861b3dbf93abb2c35b4cfb165a11aee4a20576b24763b8240b26da389d042
          envFrom:
            - configMapRef:
                name: onyx-env
          ports:
            - containerPort: 9000
              name: http
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              memory: 1Gi
            limits:
              # Bulk indexing must not take the whole node.
              memory: 6Gi
          volumeMounts:
            - name: models
              mountPath: /app/.cache/huggingface
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: onyx-models
---
apiVersion: v1
kind: Service
metadata:
  name: onyx-model
spec:
  selector:
    app.kubernetes.io/name: onyx-model
  ports:
    - name: http
      port: 9000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onyx-api
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: onyx-api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onyx-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: docker.io/onyxdotapp/onyx-backend:v4.9.6@sha256:08566ed938bb0e463c725c3a5d564471fbbd31adbff075ee131e346f772dae6a
          command:
            - /bin/sh
            - -c
            - alembic upgrade head && exec uvicorn onyx.main:app --host 0.0.0.0 --port 8080
          envFrom:
            - configMapRef:
                name: onyx-env
            - secretRef:
                name: onyx
          ports:
            - containerPort: 8080
              name: http
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            requests:
              memory: 1Gi
            limits:
              memory: 3Gi
---
apiVersion: v1
kind: Service
metadata:
  name: onyx-api
spec:
  selector:
    app.kubernetes.io/name: onyx-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onyx-background
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: onyx-background
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onyx-background
    spec:
      automountServiceAccountToken: false
      containers:
        - name: background
          image: docker.io/onyxdotapp/onyx-backend:v4.9.6@sha256:08566ed938bb0e463c725c3a5d564471fbbd31adbff075ee131e346f772dae6a
          command: ["/app/scripts/supervisord_entrypoint.sh"]
          envFrom:
            - configMapRef:
                name: onyx-env
            - secretRef:
                name: onyx
          resources:
            requests:
              memory: 2Gi
            limits:
              memory: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onyx-mcp
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: onyx-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onyx-mcp
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mcp
          image: docker.io/onyxdotapp/onyx-backend:v4.9.6@sha256:08566ed938bb0e463c725c3a5d564471fbbd31adbff075ee131e346f772dae6a
          command: ["python", "-m", "onyx.mcp_server_main"]
          envFrom:
            - configMapRef:
                name: onyx-env
            - secretRef:
                name: onyx
          ports:
            - containerPort: 8090
              name: http
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: onyx-mcp
spec:
  selector:
    app.kubernetes.io/name: onyx-mcp
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onyx-web
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: onyx-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onyx-web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: docker.io/onyxdotapp/onyx-web-server:v4.9.6@sha256:a61e3f2a16da030bff08e0d1872571f45978ffccdd00c11e7fa22e8f0ea97d87
          envFrom:
            - configMapRef:
                name: onyx-env
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: onyx-web
spec:
  selector:
    app.kubernetes.io/name: onyx-web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# Embeddings for Onyx: EmbeddingGemma-300M (multilingual, the model x-graph
# uses too) on llama.cpp's Vulkan build on the GTX 1060, as an OpenAI-style
# /v1/embeddings that Onyx calls through its LiteLLM provider (search settings,
# set once through the API: docs/search.md). The GPU belongs to kokoro-tts in
# the device plugin (nvidia.com/gpu: 1), so this pod requests no GPU and gets
# it from the nvidia runtime through NVIDIA_VISIBLE_DEVICES: it needs ~0.5 GiB
# next to kokoro's ~1.9 GiB of the 3 GiB.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: onyx-embed-models
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onyx-embed
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: onyx-embed
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onyx-embed
    spec:
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      initContainers:
        - name: fetch-model
          image: docker.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
          command:
            - sh
            - -c
            - |
              set -e
              f=/models/embeddinggemma-300M-Q8_0.gguf
              if [ "$(stat -c %s "$f" 2>/dev/null)" != "333590944" ]; then
                curl -fsSL --retry 5 -o "$f.part" https://huggingface.co/ggml-org/embeddinggemma-300M-GGUF/resolve/main/embeddinggemma-300M-Q8_0.gguf
                mv "$f.part" "$f"
              fi
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:0b65e1964e923a71a527511fa31cc5ab0c5a2b3905a5a51845bef2d1a9ac9bad
          args:
            - -m
            - /models/embeddinggemma-300M-Q8_0.gguf
            - --embeddings
            - --pooling
            - mean
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - -ngl
            - "99"
            - -c
            - "8192"
            - --parallel
            - "4"
            - -b
            - "2048"
            - -ub
            - "2048"
            - -t
            - "2"
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility,graphics
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            failureThreshold: 30
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: onyx-embed-models
---
apiVersion: v1
kind: Service
metadata:
  name: onyx-embed
spec:
  selector:
    app.kubernetes.io/name: onyx-embed
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Upstream's nginx routes (deployment/data/nginx) in Traefik: /api/* to the API
# without the prefix, /mcp/* to the MCP server without the prefix, the OAuth
# discovery documents, everything else to the web app.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: onyx-strip-api
spec:
  stripPrefixRegex:
    regex:
      - ^/api
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: onyx-strip-mcp
spec:
  replacePathRegex:
    regex: ^/mcp/?(.*)$
    replacement: /$1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: onyx-oauth-metadata
spec:
  replacePath:
    path: /oauth-provider/metadata
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: onyx
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`search.erikfrankling.duckdns.org`) && PathRegexp(`^/\.well-known/oauth-authorization-server(/.*)?$`)
      priority: 100
      middlewares:
        - name: lan-and-cluster
        - name: onyx-oauth-metadata
      services:
        - name: onyx-api
          port: 8080
    - kind: Rule
      match: Host(`search.erikfrankling.duckdns.org`) && PathRegexp(`^/\.well-known/oauth-protected-resource(/.*)?$`)
      priority: 100
      middlewares:
        - name: lan-and-cluster
      services:
        - name: onyx-mcp
          port: 8090
    - kind: Rule
      match: Host(`search.erikfrankling.duckdns.org`) && Path(`/mcp/oauth/callback`)
      priority: 100
      middlewares:
        - name: lan-and-cluster
      services:
        - name: onyx-web
          port: 3000
    - kind: Rule
      match: Host(`search.erikfrankling.duckdns.org`) && PathRegexp(`^/mcp(/.*)?$`)
      priority: 90
      middlewares:
        - name: lan-and-cluster
        - name: onyx-strip-mcp
      services:
        - name: onyx-mcp
          port: 8090
    - kind: Rule
      match: Host(`search.erikfrankling.duckdns.org`) && (PathRegexp(`^/api(/.*)?$`) || Path(`/openapi.json`))
      priority: 90
      middlewares:
        - name: lan-and-cluster
        - name: onyx-strip-api
      services:
        - name: onyx-api
          port: 8080
    - kind: Rule
      match: Host(`search.erikfrankling.duckdns.org`)
      priority: 10
      middlewares:
        - name: lan-and-cluster
      services:
        - name: onyx-web
          port: 3000
