# Kokoro TTS (Kokoro-FastAPI) on the GTX 1060: the small read-aloud voice for
# T3 Code on the PC, used while dictation holds the PC's GPU (see ~/.dotfiles
# research/read-aloud). OpenAI-style POST /v1/audio/speech on the LAN at
# 192.168.50.100:8880. On this node's CPU it was slower than real time.
#
# cu126 image: cu128+ builds of PyTorch no longer support Pascal (sm_61).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kokoro-tts
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kokoro-tts
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kokoro-tts
    spec:
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      containers:
        - name: kokoro-tts
          image: ghcr.io/remsky/kokoro-fastapi-gpu:v0.9.2-cu126@sha256:9e215d5396edf212e008ffc0025bcd0d92f827783dda338bda1034a0f6fdabc1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8880
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 30
            httpGet:
              path: /v1/audio/voices
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /v1/audio/voices
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            limits:
              memory: 3Gi
              nvidia.com/gpu: 1
            requests:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: kokoro-tts
spec:
  externalTrafficPolicy: Local
  ports:
    - name: http
      port: 8880
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/name: kokoro-tts
  type: LoadBalancer
