{
  "apiVersion": "v1",
  "kind": "PersistentVolumeClaim",
  "metadata": {
    "name": "authentik-postgresql",
    "annotations": {
      "kustomize.toolkit.fluxcd.io/prune": "disabled"
    }
  },
  "spec": {
    "accessModes": [
      "ReadWriteOnce"
    ],
    "storageClassName": "local-path",
    "resources": {
      "requests": {
        "storage": "5Gi"
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "authentik-postgresql"
  },
  "spec": {
    "selector": {
      "app.kubernetes.io/name": "authentik-postgresql"
    },
    "ports": [
      {
        "port": 5432,
        "targetPort": 5432
      }
    ]
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "authentik-postgresql"
  },
  "spec": {
    "replicas": 1,
    "strategy": {
      "type": "Recreate"
    },
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "authentik-postgresql"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "authentik-postgresql"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "securityContext": {
          "runAsUser": 70,
          "runAsGroup": 70,
          "fsGroup": 70
        },
        "containers": [
          {
            "name": "postgresql",
            "image": "postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139",
            "env": [
              {
                "name": "POSTGRES_DB",
                "value": "authentik"
              },
              {
                "name": "POSTGRES_USER",
                "value": "authentik"
              },
              {
                "name": "PGDATA",
                "value": "/var/lib/postgresql/data/pgdata"
              }
            ],
            "envFrom": [
              {
                "secretRef": {
                  "name": "authentik-postgresql"
                }
              }
            ],
            "ports": [
              {
                "containerPort": 5432
              }
            ],
            "readinessProbe": {
              "exec": {
                "command": [
                  "pg_isready",
                  "-U",
                  "authentik"
                ]
              },
              "periodSeconds": 10
            },
            "resources": {
              "requests": {
                "memory": "128Mi"
              },
              "limits": {
                "memory": "512Mi"
              }
            },
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/var/lib/postgresql/data"
              }
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false
            }
          }
        ],
        "volumes": [
          {
            "name": "data",
            "persistentVolumeClaim": {
              "claimName": "authentik-postgresql"
            }
          }
        ]
      }
    }
  }
}
