# Grafana for the homelab stack (docs/observability.md, docs/sso.md).
# Native OIDC automatically reuses the Authentik session. Local admin
# recovery login remains available at /login?disableAutoLogin=true.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      automountServiceAccountToken: false
      priorityClassName: homelab-core
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
          env:
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: sso-clients, key: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
            - {"name": "GF_AUTH_GENERIC_OAUTH_ENABLED", "value": "true"}
            - {"name": "GF_AUTH_GENERIC_OAUTH_NAME", "value": "Homelab"}
            - {"name": "GF_AUTH_GENERIC_OAUTH_CLIENT_ID", "value": "homelab-grafana"}
            - {"name": "GF_AUTH_GENERIC_OAUTH_SCOPES", "value": "openid profile email"}
            - {"name": "GF_AUTH_GENERIC_OAUTH_AUTH_URL", "value": "https://auth.erikfrankling.duckdns.org/application/o/authorize/"}
            - {"name": "GF_AUTH_GENERIC_OAUTH_TOKEN_URL", "value": "https://auth.erikfrankling.duckdns.org/application/o/token/"}
            - {"name": "GF_AUTH_GENERIC_OAUTH_API_URL", "value": "https://auth.erikfrankling.duckdns.org/application/o/userinfo/"}
            - {"name": "GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN", "value": "true"}
            - {"name": "GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP", "value": "true"}
            - {"name": "GF_AUTH_GENERIC_OAUTH_USE_PKCE", "value": "true"}
            - {"name": "GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH", "value": "contains(groups[*], 'authentik Admins') && 'Admin' || 'Viewer'"}
            - {"name": "GF_AUTH_LOGIN_MAXIMUM_INACTIVE_LIFETIME_DURATION", "value": "30d"}
            - {"name": "GF_AUTH_LOGIN_MAXIMUM_LIFETIME_DURATION", "value": "90d"}
            - {name: GF_SERVER_ROOT_URL, value: "https://grafana.erikfrankling.duckdns.org/"}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
            - {name: GF_NEWS_NEWS_FEED_ENABLED, value: "false"}
            # Grafana 13 "updates" bundled plugins in the background; on the
            # read-only root fs that unloads them (Prometheus gone, 2026-10-23).
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
            - {name: GF_PLUGINS_PREINSTALL_AUTO_UPDATE, value: "false"}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana-dashboards/home.json}
          envFrom:
            - secretRef:
                name: grafana-admin
          ports:
            - {containerPort: 3000, name: http}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
          resources:
            limits:
              memory: 512Mi
            requests:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: dashboard-providers, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
            - {name: dashboards, mountPath: /var/lib/grafana-dashboards, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-providers
          configMap:
            name: grafana-dashboard-providers
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - {name: http, port: 80, targetPort: http}
