# brain: the company brain. Workflows, skills, session reports and notes that
# agents search before a task and publish after it, with an access log of every
# lookup. Web UI, HTTP API and MCP (/mcp) in one Node process over one SQLite
# file in /data. Agents reach it through the Executor app `brain`; skills saved
# here are what Executor's `skills` tool serves.
#
# Source: husk-security/agent-company, apps/brain (private). There is no
# registry: apps/brain/deploy/homelab-image.sh builds the image on naiaclaw and
# imports it into k3s's containerd, hence imagePullPolicy Never. After a node
# rebuild, run that script again before the pod can start.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: brain-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brain
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: brain
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: brain
    spec:
      automountServiceAccountToken: false
      containers:
        - name: brain
          image: docker.io/library/brain:96f04c64fe78
          imagePullPolicy: Never
          env:
            - name: BRAIN_BASE_URL
              value: https://brain.erikfrankling.duckdns.org
          envFrom:
            # BRAIN_TOKEN: bearer token for /mcp and /api, and the web sign-in.
            - secretRef:
                name: brain
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            limits:
              memory: 512Mi
            requests:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /data
              name: data
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: brain-data
---
apiVersion: v1
kind: Service
metadata:
  name: brain
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/name: brain
