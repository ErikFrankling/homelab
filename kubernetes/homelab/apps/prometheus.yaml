# Prometheus: metrics and alert rules (config/prometheus/, docs/observability.md).
# 400 days, capped at 25 GB. Also the OTLP metrics receiver behind the Alloy
# gateway.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=400d
            - --storage.tsdb.retention.size=25GB
            - --web.enable-otlp-receiver
            - --web.enable-lifecycle
            - --web.external-url=https://prometheus.erikfrankling.duckdns.org
          ports:
            - {containerPort: 9090, name: http}
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 60
            failureThreshold: 5
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - {name: http, port: 9090, targetPort: http}
