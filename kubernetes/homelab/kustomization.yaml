apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homelab
resources:
  - config/homelab-config.yaml
  - ingress/middleware.yaml
  - ingress/routes.yaml
  - ingress/external-services.yaml
  - ingress/external-routes.yaml
  - apps/adguard.yaml
  - apps/vaultwarden.yaml
  - apps/hermes.yaml
  - apps/openwebui.yaml
  - apps/searxng.yaml
  - apps/openclaw.yaml
  - apps/time.yaml
  - secrets/openclaw.enc.yaml
  - secrets/searxng.enc.yaml
  - secrets/adguard.enc.yaml
  - backup/backup.yaml
configMapGenerator:
  # Content-hashed name: editing config/AdGuardHome.yaml rolls the adguard
  # deployment automatically.
  - name: adguard-config
    files:
      - config/AdGuardHome.yaml
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: homelab
