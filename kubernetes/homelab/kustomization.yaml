apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homelab
resources:
  - config/homelab-config.yaml
  - ingress/middleware.yaml
  - ingress/routes.yaml
  - ingress/external-services.yaml
  - ingress/external-routes.yaml
  - ingress/dev-preview.yaml
  - apps/adguard.yaml
  - apps/vaultwarden.yaml
  - apps/hermes.yaml
  - apps/openwebui.yaml
  - apps/searxng.yaml
  - apps/openclaw.yaml
  - apps/time.yaml
  - apps/executor.yaml
  - apps/brain.yaml
  - apps/nix-builder.yaml
  - apps/agent-worker.yaml
  - apps/gatus.yaml
  - apps/kokoro-tts.yaml
  - apps/x-graph-embed.yaml
  - apps/t3-updates.yaml
  - apps/ntfy.yaml
  - apps/alloy.yaml
  - apps/prometheus.yaml
  - apps/alertmanager.yaml
  - apps/loki.yaml
  - apps/grafana.yaml
  - apps/kube-state-metrics.yaml
  - apps/node-exporter.yaml
  - dns/duckdns.yaml
  - secrets/openclaw.enc.yaml
  - secrets/searxng.enc.yaml
  - secrets/adguard.enc.yaml
  - secrets/duckdns.enc.yaml
  - secrets/executor.enc.yaml
  - secrets/brain.enc.yaml
  - secrets/nix-builder.enc.yaml
  - secrets/gatus.enc.yaml
  - secrets/ntfy.enc.yaml
  - secrets/time-ntfy.enc.yaml
  - secrets/alerts-ntfy.enc.yaml
  - secrets/otlp-ingest.enc.yaml
  - secrets/grafana.enc.yaml
  - backup/backup.yaml
configMapGenerator:
  # Content-hashed name: editing config/AdGuardHome.yaml rolls the adguard
  # deployment automatically.
  - name: adguard-config
    files:
      - config/AdGuardHome.yaml
  # Same idea: any change to the builder's scripts or settings restarts it.
  - name: nix-builder-config
    files:
      - config/nix-builder/seed.sh
      - config/nix-builder/entrypoint.sh
      - config/nix-builder/sshd_config
      - config/nix-builder/nix.conf
      - config/nix-builder/harmonia.toml
      - config/nix-builder/authorized_keys
  # The T3 Code update server: editing it restarts the pod.
  - name: t3-updates-code
    files:
      - config/t3-updates/server.mjs
  # ntfy settings: editing them restarts ntfy.
  - name: ntfy-config
    files:
      - config/ntfy/server.yml
  # The agents' heavy-work pod; same authorized key as the builder.
  - name: agent-worker-config
    files:
      - config/agent-worker/seed.sh
      - config/agent-worker/entrypoint.sh
      - config/agent-worker/sshd_config
      - config/agent-worker/nix.conf
      - config/agent-worker/nixpkgs-config.nix
      - config/agent-worker/android.nix
      - config/agent-worker/heavy-run.sh
      - config/agent-worker/heavy-status.sh
      - config/agent-worker/heavy-emulator.sh
      - authorized_keys=config/nix-builder/authorized_keys
  # And the health checks: editing the list restarts Gatus.
  - name: gatus-config
    files:
      - config.yaml=config/gatus/config.yaml
  # Observability (docs/observability.md): editing any of these restarts
  # the component that reads it.
  - name: prometheus-config
    files:
      - config/prometheus/prometheus.yml
      - config/prometheus/homelab.rules.yml
  - name: alertmanager-config
    files:
      - config/alertmanager/alertmanager.yml
  - name: loki-config
    files:
      - config/loki/loki.yaml
  - name: loki-rules
    files:
      - config/loki/rules.yml
  - name: alloy-config
    files:
      - config/alloy/config.alloy
  - name: grafana-datasources
    files:
      - config/grafana/datasources.yaml
  - name: grafana-dashboard-providers
    files:
      - config/grafana/dashboards.yaml
  - name: grafana-dashboards
    files:
      - config/grafana/dashboards/home.json
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: homelab
