apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homelab
resources:
  - config/homelab-config.yaml
  - ingress/middleware.yaml
  - ingress/routes.yaml
  - ingress/external-services.yaml
  - ingress/external-routes.yaml
  - ingress/dev-preview.yaml
  - apps/adguard.yaml
  - apps/vaultwarden.yaml
  - apps/hermes.yaml
  - apps/openwebui.yaml
  - apps/searxng.yaml
  - apps/openclaw.yaml
  - apps/time.yaml
  - apps/time-v2.yaml
  - apps/school.yaml
  - apps/executor.yaml
  - apps/brain.yaml
  - apps/nix-builder.yaml
  - apps/agent-worker.yaml
  - apps/cpu-priority.yaml
  - apps/gatus.yaml
  - apps/kokoro-tts.yaml
  - apps/x-graph-embed.yaml
  - apps/onyx.yaml
  - apps/t3-updates.yaml
  - apps/notify-gateway.yaml
  - apps/ntfy.yaml
  - apps/alloy.yaml
  - apps/prometheus.yaml
  - apps/alertmanager.yaml
  - apps/loki.yaml
  - apps/grafana.yaml
  - apps/kube-state-metrics.yaml
  - apps/node-exporter.yaml
  - dns/duckdns.yaml
  - secrets/openclaw.enc.yaml
  - secrets/searxng.enc.yaml
  - secrets/adguard.enc.yaml
  - secrets/duckdns.enc.yaml
  - secrets/executor.enc.yaml
  - secrets/brain.enc.yaml
  - secrets/nix-builder.enc.yaml
  - secrets/gatus.enc.yaml
  - secrets/ntfy.enc.yaml
  - secrets/alerts-ntfy.enc.yaml
  - secrets/notify-gateway.enc.yaml
  - secrets/time-notify.enc.yaml
  - secrets/time-mcp.enc.yaml
  - secrets/time-decide.enc.yaml
  - secrets/otlp-ingest.enc.yaml
  - secrets/grafana.enc.yaml
  - secrets/alerts-discord.enc.yaml
  - secrets/onyx.enc.yaml
  - secrets/school.enc.yaml
  - backup/backup.yaml
configMapGenerator:
  # Not content-hashed: apply.sh re-reads the rules every 30 s, so edits take
  # effect without restarting the DaemonSet.
  - name: cpu-priority
    options:
      disableNameSuffixHash: true
    files:
      - config/cpu-priority/rules
      - config/cpu-priority/apply.sh
  # Content-hashed name: editing config/AdGuardHome.yaml rolls the adguard
  # deployment automatically.
  - name: adguard-config
    files:
      - config/AdGuardHome.yaml
  # Same idea: any change to the builder's scripts or settings restarts it.
  - name: nix-builder-config
    files:
      - config/nix-builder/seed.sh
      - config/nix-builder/entrypoint.sh
      - config/nix-builder/sshd_config
      - config/nix-builder/nix.conf
      - config/nix-builder/harmonia.toml
      - config/nix-builder/authorized_keys
  # The T3 Code update server: editing it restarts the pod.
  - name: t3-updates-code
    files:
      - config/t3-updates/server.mjs
  # The school calendar (apps/school.yaml): editing it restarts the pod.
  - name: school-code
    files:
      - config/school/server.mjs
      - config/school/index.html
  # The notify gateway: editing it restarts the pod.
  - name: notify-gateway-code
    files:
      - config/notify-gateway/server.mjs
  # ntfy settings: editing them restarts ntfy.
  - name: ntfy-config
    files:
      - config/ntfy/server.yml
  # The agents' heavy-work pod; same authorized key as the builder.
  - name: agent-worker-config
    files:
      - config/agent-worker/seed.sh
      - config/agent-worker/entrypoint.sh
      - config/agent-worker/sshd_config
      - config/agent-worker/nix.conf
      - config/agent-worker/cgroups.sh
      - config/agent-worker/heavy-run.sh
      - config/agent-worker/heavy-status.sh
      - config/agent-worker/heavy-bg.sh
      - config/agent-worker/heavy-emulator.sh
      - authorized_keys=config/nix-builder/authorized_keys
  # The worker's runtime scripts, without a content hash: an edit reaches the
  # running pod in about a minute (kubelet syncs the volume) instead of
  # restarting it and killing every job and the emulator. /config only has
  # fixed shims that exec these.
  - name: agent-worker-scripts
    options:
      disableNameSuffixHash: true
    files:
      - config/agent-worker/scripts/heavy-run.sh
      - config/agent-worker/scripts/cgroups.sh
      - config/agent-worker/scripts/housekeeping.sh
      - config/agent-worker/scripts/heavy-status.sh
      - config/agent-worker/scripts/heavy-bg.sh
      - config/agent-worker/scripts/heavy-emulator.sh
      - config/agent-worker/scripts/android.nix
      - config/agent-worker/scripts/nixpkgs-config.nix
  # And the health checks: editing the list restarts Gatus.
  - name: gatus-config
    files:
      - config.yaml=config/gatus/config.yaml
  # Observability (docs/observability.md): editing any of these restarts
  # the component that reads it.
  - name: prometheus-config
    files:
      - config/prometheus/prometheus.yml
      - config/prometheus/homelab.rules.yml
  - name: alertmanager-config
    files:
      - config/alertmanager/alertmanager.yml
  - name: loki-config
    files:
      - config/loki/loki.yaml
  - name: loki-rules
    files:
      - config/loki/rules.yml
  - name: alloy-config
    files:
      - config/alloy/config.alloy
  - name: grafana-datasources
    files:
      - config/grafana/datasources.yaml
  - name: grafana-dashboard-providers
    files:
      - config/grafana/dashboards.yaml
  - name: grafana-dashboards
    files:
      - config/grafana/dashboards/home.json
      - config/grafana/dashboards/processes.json
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: homelab
