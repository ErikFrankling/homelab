use_default_settings: true

search:
  formats:
    - html
    - json

server:
  # The live Kubernetes settings file is SOPS-encrypted. This public,
  # legacy-Compose copy deliberately contains no usable secret.
  secret_key: "REPLACE_WITH_A_SECRET_OUTSIDE_GIT"
  limiter: false
  bind_address: "0.0.0.0"
  port: 8080
