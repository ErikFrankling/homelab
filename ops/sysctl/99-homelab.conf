# The single-node cluster runs enough controllers and file-watching
# applications to exceed Ubuntu's conservative per-UID inotify defaults.
fs.inotify.max_user_instances = 1024
fs.inotify.max_user_watches = 524288

# Ubuntu 24.04 denies unprivileged user namespaces to unconfined processes.
# Inside the nix-builder pod that breaks every build that sets up its own
# sandbox within Nix's (bwrap: "setting up uid map: Permission denied"), such as
# vmware-workstation. Other distributions, NixOS included, allow this; see
# docs/nix-builder.md.
kernel.apparmor_restrict_unprivileged_userns = 0
