# The VM's hostname is k8s. The node keeps its original name because every
# local-path PersistentVolume is pinned to node `naiaclaw` by nodeAffinity.
node-name: naiaclaw

# The VM has a single address, 192.168.50.100, which DuckDNS points at. With it
# as the node IP, ServiceLB publishes it as every LoadBalancer ingress IP, so
# kube-proxy delivers LAN traffic on the source-preserving LoadBalancer path and
# Traefik's lan-only allowlist sees real client addresses. The apiserver
# advertises the same address. Until 2026-10-18 the node IP was .200 with .100
# as a second "VIP", which needed node-external-ip and an advertise-address pin.
node-ip: 192.168.50.100

# The kubelet never enforces CPU limits on this node; see docs/architecture.md.
kubelet-arg:
  - cpu-cfs-quota=false
# 110 (the default) was full by 2026-10-23: Gatus, alloy and CronJob runs sat
# Pending with "Too many pods". The node's /24 pod CIDR has room for 200.
  - max-pods=200
