# Install as /etc/systemd/system/system.slice.d/50-homelab-cpu.conf on
# naiaclaw, then `sudo systemctl daemon-reload` (applies without restarts).
#
# k3s (apiserver, kine, kubelet, containerd) runs in system.slice. At the
# default weight 100 it got about 2 of 8 cores when the pods (kubepods.slice,
# weight 313) saturated the node. On 2026-10-27 that left kine's SQL queries
# taking up to 49 s: lease renewals timed out, Flux, Kyverno and the sandbox
# controller lost leader election and restarted together, and with Kyverno's
# fail-closed webhook down even pod creation failed. Equal weight with the
# pods keeps the control plane ahead of any build.
[Slice]
CPUWeight=313
