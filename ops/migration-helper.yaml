apiVersion: v1
kind: Pod
metadata:
  name: migration-helper
  namespace: homelab
  labels:
    app.kubernetes.io/name: migration-helper
    app.kubernetes.io/part-of: homelab
spec:
  automountServiceAccountToken: false
  containers:
    - name: helper
      image: busybox:1.37.0
      command:
        - sh
        - -c
        - "trap : TERM INT; sleep infinity & wait"
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 10m
          memory: 16Mi
      securityContext:
        allowPrivilegeEscalation: false
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - mountPath: /mnt/adguard
          name: adguard
        - mountPath: /mnt/hermes
          name: hermes
        - mountPath: /mnt/openclaw
          name: openclaw
        - mountPath: /mnt/openwebui
          name: openwebui
        - mountPath: /mnt/vaultwarden
          name: vaultwarden
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  volumes:
    - name: adguard
      persistentVolumeClaim:
        claimName: adguard-data
    - name: hermes
      persistentVolumeClaim:
        claimName: hermes-data
    - name: openclaw
      persistentVolumeClaim:
        claimName: openclaw-data
    - name: openwebui
      persistentVolumeClaim:
        claimName: openwebui-data
    - name: vaultwarden
      persistentVolumeClaim:
        claimName: vaultwarden-data
